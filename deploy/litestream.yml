# Production Litestream config — replicates the SQLite DB to S3-compatible
# object storage. Wired to Fly's Tigris by reading the same AWS_* env vars
# `fly storage create` sets on the machine; no secret duplication, no
# Litestream-specific naming convention to maintain.
#
# For a local mirror (`bun devctl dev --litestream`) point the same AWS_*
# env vars at any S3-compatible store — see docs/deploy.md.
dbs:
  - path: ${DATABASE_PATH}
    replicas:
      - type: s3
        bucket: ${BUCKET_NAME}
        path: db
        endpoint: ${AWS_ENDPOINT_URL_S3}
        region: ${AWS_REGION}
        access-key-id: ${AWS_ACCESS_KEY_ID}
        secret-access-key: ${AWS_SECRET_ACCESS_KEY}
