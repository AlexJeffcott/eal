# fly.toml — eal on Fly.io.
#
# `app` and `primary_region` are placeholders; `fly launch` sets them, or edit
# here. The container is the shared deploy/Dockerfile. No [mounts]: the disk is
# ephemeral by design — Litestream restores the DB on cold start and replicates
# it continuously (deploy/entrypoint.sh).
#
# Secrets (LITESTREAM_*) go via `fly secrets set` — see docs/deploy.md.

app = "eal"
primary_region = "lhr"  # set to your nearest Fly region

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/eal.db"
  # The platform proxy terminates TLS; the container speaks plain HTTP.
  SKIP_TLS = "1"
  LITESTREAM_CONFIG = "deploy/litestream.yml"
  # EAL_ORIGIN — the public origin; the WebAuthn RP ID is its hostname. Set this
  # to your real domain once you know it (e.g. https://eal.fly.dev), then deploy.
  EAL_ORIGIN = "https://eal.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/public/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
