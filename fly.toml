# fly.toml — eal on Fly.io.
#
# `app` and `primary_region` are placeholders; `fly launch` sets them, or edit
# here. The container is the shared deploy/Dockerfile. Storage is both the
# [mounts] volume below and Litestream replication (deploy/entrypoint.sh) — see
# the section at [mounts] for which one covers what.
#
# Secrets (LITESTREAM_*) go via `fly secrets set` — see docs/deploy.md.

app = "eal"
primary_region = "cdg"  # closest Fly region to Italy

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/eal.db"
  # The platform proxy terminates TLS; the container speaks plain HTTP.
  SKIP_TLS = "1"
  LITESTREAM_CONFIG = "deploy/litestream.yml"
  EAL_ORIGIN = "https://eal.fly.dev"
  # Mounts the four Twilio webhook routes and the media WS. The three
  # TWILIO_* secrets must already be set or the api refuses to boot — see
  # twilio/config.ts, which validates shape only and calls nothing at boot.
  # Set them with `fly secrets import --stage` first, so one deploy carries
  # both halves and the machine restarts once.
  TWILIO_ENABLED = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  # Family-phone's WS handler and SQLite both live in-process, so two machines
  # would diverge on state. Until we move to LiteFS or Postgres + Redis, the
  # deploy is intentionally single-machine.
  min_machines_running = 1
  max_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/public/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Persistent SQLite data on a Fly volume. Survives redeploys and machine
# restarts; doesn't survive the machine being deleted (region migration,
# manual destroy). Litestream is wired and covers exactly that gap: the
# entrypoint restores from object storage when /data/eal.db is absent, and
# replicates continuously either way — see docs/deploy.md.
[mounts]
  source = "eal_data"
  destination = "/data"
