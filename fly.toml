# fly.toml — eal on Fly.io.
#
# `app` and `primary_region` are placeholders; `fly launch` sets them, or edit
# here. The container is the shared deploy/Dockerfile. No [mounts]: the disk is
# ephemeral by design — Litestream restores the DB on cold start and replicates
# it continuously (deploy/entrypoint.sh).
#
# Secrets (LITESTREAM_*) go via `fly secrets set` — see docs/deploy.md.

app = "eal"
primary_region = "cdg"  # closest Fly region to Italy

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/eal.db"
  # The platform proxy terminates TLS; the container speaks plain HTTP.
  SKIP_TLS = "1"
  LITESTREAM_CONFIG = "deploy/litestream.yml"
  # First deploy bypasses Litestream — ephemeral disk only, data resets on
  # every machine start. Wire up the LITESTREAM_* secrets and drop this once
  # the deploy is worth keeping.
  SKIP_LITESTREAM = "1"
  EAL_ORIGIN = "https://eal.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  # Family-phone's WS handler and SQLite both live in-process, so two machines
  # would diverge on state. Until we move to LiteFS or Postgres + Redis, the
  # deploy is intentionally single-machine.
  min_machines_running = 1
  max_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/public/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
